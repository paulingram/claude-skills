<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run Summary</title>
  <meta name="description" content="A sample self-contained page that satisfies the CT6 page contract.">
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1c1c1a;
      --muted: #5f5f5a;
      --accent: #2563eb;
      --surface: #ffffff;
      --line: #e3e3de;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16161a;
        --fg: #ececea;
        --muted: #a3a39c;
        --accent: #7da2ff;
        --surface: #1f1f24;
        --line: #33333a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16161a;
      --fg: #ececea;
      --muted: #a3a39c;
      --accent: #7da2ff;
      --surface: #1f1f24;
      --line: #33333a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p.lede { color: var(--muted); margin: 0 0 20px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 1.05rem; margin: 0 0 8px; }
    svg { display: block; width: 100%; height: auto; }
    svg text { fill: var(--fg); font-size: 12px; }
    .bar { fill: var(--accent); }
    .axis { stroke: var(--line); }
    @media (max-width: 400px) { body { padding: 16px; } h1 { font-size: 1.3rem; } }
  </style>
</head>
<body>
  <main>
    <h1>Run Summary</h1>
    <p class="lede">Three phases, two reviewers, one green suite.</p>
    <section class="card">
      <h2>Phase durations</h2>
      <svg viewBox="0 0 320 120" role="img" aria-label="Bar chart of phase durations">
        <line class="axis" x1="40" y1="100" x2="310" y2="100" stroke-width="1"></line>
        <rect class="bar" x="60" y="40" width="40" height="60"></rect>
        <rect class="bar" x="140" y="20" width="40" height="80"></rect>
        <rect class="bar" x="220" y="70" width="40" height="30"></rect>
        <text x="80" y="114" text-anchor="middle">plan</text>
        <text x="160" y="114" text-anchor="middle">build</text>
        <text x="240" y="114" text-anchor="middle">review</text>
      </svg>
    </section>
    <section class="card">
      <h2>What shipped</h2>
      <p>The page is one file: no external scripts, no outbound calls, colors follow the viewer's theme.</p>
    </section>
  </main>
</body>
</html>
